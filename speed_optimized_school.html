<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Optimized School System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.container{padding:20px}
button{padding:10px 15px;margin:5px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff}
td,th{padding:10px;border:1px solid #ddd}
</style>
</head>

<body>

<div class="container">
<h2>🚀 Fast School Management (Optimized)</h2>

<button onclick="loadStudents()">Load Students</button>

<table id="table">
<thead>
<tr>
<th>Name</th><th>Class</th><th>Roll</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCpPisj0rdWJbHYv3SsuFYEGAL1R2QIms",
  authDomain: "school-management-1000.firebaseapp.com",
  projectId: "school-management-1000"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ Load only 20 students (pagination)
window.loadStudents = async function(){
  const q = query(collection(db, "students"), limit(20));
  const snap = await getDocs(q);

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();
    tbody.innerHTML += `
      <tr>
        <td>${d.name||""}</td>
        <td>${d.class||""}</td>
        <td>${d.roll||""}</td>
      </tr>`;
  });
};
</script>

</body>
</html>
